:root[data-theme="dark"]{--bg:#1b1a18;--fg:#eee9df;--sub:#a49d90;--card:#252320;--line:#3a3731;--acc:#e08a60;--chip:#312e29;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.5}

.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:4px 12px;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:1rem;margin-bottom:12px}
.list{display:grid;gap:6px}
.item{display:flex;gap:10px;align-items:baseline;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.no{color:var(--sub);font-size:.75rem;min-width:2em}
.name{font-weight:700}
.tag{color:var(--sub);font-size:.72rem;margin-left:6px}
.val{margin-left:auto;font-weight:700;color:var(--acc);text-align:right}
.foot{color:var(--sub);font-size:.8rem;margin-top:18px}

<div class="bar" id="bar"></div>
<input id="q" type="search" placeholder="名前・数値で検索">
<div class="list" id="list"></div>
<p class="foot">※ 値は概数です。ポンド法の「米」「英」の違い、中国・インド・タイなどの地域単位、日本の畳・東京ドームなどは基準により揺れがあります。</p>

function render(){

 Object.keys(N).forEach(function(k){var b=document.createElement("button");b.className="chip"+(k===cur?" on":"");b.textContent=N[k];b.onclick=function(){cur=k;render()};bar.appendChild(b)});
}
